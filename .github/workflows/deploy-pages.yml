name: Deploy Pages

on:
  push:
    branches: [examples]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-ecommerce:
    name: 构建电商示例
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/ecommerce/package-lock.json
      - name: 安装依赖
        working-directory: examples/ecommerce
        run: npm ci
      - name: 本地化下载地图（学习用途）
        working-directory: examples/ecommerce
        run: node ../../skills/boardify/scripts/fetch-maps.mjs . --learning-only
      - name: 构建
        working-directory: examples/ecommerce
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ecommerce-dist
          path: examples/ecommerce/dist

  build-agriculture:
    name: 构建农业示例
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/agriculture/package-lock.json
      - name: 安装依赖
        working-directory: examples/agriculture
        run: npm ci
      - name: 本地化下载地图（学习用途）
        working-directory: examples/agriculture
        run: node ../../skills/boardify/scripts/fetch-maps.mjs . --learning-only
      - name: 构建
        working-directory: examples/agriculture
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: agriculture-dist
          path: examples/agriculture/dist

  deploy:
    name: 部署 GitHub Pages
    needs: [build-ecommerce, build-agriculture]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ecommerce-dist
          path: site/ecommerce
      - uses: actions/download-artifact@v4
        with:
          name: agriculture-dist
          path: site/agriculture
      - name: 生成索引页
        run: cp .github/pages/index.html site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
