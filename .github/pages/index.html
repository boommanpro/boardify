<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boardify 示例演示</title>
<style>
  :root { color-scheme: light dark; }
  * { margin: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #101418;
    color: #e8eaed;
    padding: 24px;
  }
  main { max-width: 640px; width: 100%; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: 0.5px; }
  .lead { margin-top: 10px; font-size: 14px; color: #9aa0a6; line-height: 1.7; }
  .cards { margin-top: 28px; display: flex; flex-direction: column; gap: 12px; }
  a.card {
    display: block;
    padding: 18px 20px;
    border: 1px solid #2a2f35;
    border-radius: 10px;
    text-decoration: none;
    color: inherit;
    background: #171b20;
    transition: border-color 0.15s ease;
  }
  a.card:hover { border-color: #4a90d9; }
  .card h2 { font-size: 15px; font-weight: 600; color: #e8eaed; }
  .card p { margin-top: 6px; font-size: 13px; color: #9aa0a6; line-height: 1.6; }
  footer { margin-top: 32px; font-size: 12px; color: #6b7075; line-height: 1.7; }
</style>
</head>
<body>
<main>
  <h1>Boardify 示例演示</h1>
  <p class="lead">以下页面由 <strong>boardify</strong> 数据大盘构建技能生成，全部为模拟演示数据。示例源码维护于仓库 <code>examples</code> 分支。</p>
  <div class="cards">
    <a class="card" href="./ecommerce/">
      <h2>电商单屏经营大盘</h2>
      <p>本地中国地图、省市区逐级下钻，适配 2560×1440 / 1920×1080 / 1366×768 三种分辨率。</p>
    </a>
    <a class="card" href="./agriculture/">
      <h2>全国农业数据大屏</h2>
      <p>16:9 定屏等比缩放，全国 → 省 → 市 → 区县下钻，支持滚轮缩放与拖动平移。</p>
    </a>
  </div>
  <footer>地图来源：阿里云 DataV.GeoAtlas（仅供学习交流使用，未取得商用与再分发许可）；演示数据不代表官方统计，不构成任何投资或经营建议。</footer>
</main>
</body>
</html>
